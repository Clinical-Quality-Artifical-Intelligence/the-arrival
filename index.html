<script>

(function () {

  var phases = ['Taking observations', 'Synthesising acoustic bank', 'Briefing the agents', 'Safety-netting', 'Handing over'];
  var isShot = location.search.indexOf('shot') !== -1;
  var lastSec = -1, lastPhase = -1, phaseStart = 0, lastTyped = 0;

    var c = getLoaderCtx();

  }
  function unlockLoaderAudio(ev) {

  window.addEventListener('DOMContentLoaded', tryAutoLoaderAudio, { once: true });
  window.addEventListener('load', tryAutoLoaderAudio, { once: true });
  window.addEventListener('pageshow', tryAutoLoaderAudio, { passive: true });
  window.addEventListener('focus', tryAutoLoaderAudio, { passive: true });
  ['pointerdown', 'mousedown', 'mouseup', 'keydown', 'keyup', 'touchstart', 'touchend', 'wheel', 'click'].forEach(function (evName) {
    window.addEventListener(evName, unlockLoaderAudio, { capture: true, passive: true });
  });

  // Play exact LBS buffers during loader once __lbsAudio is available, or fallback resonator
  function playLbsLoaderHit(name, gain, pitch, pan) {
    if (window.__lbsSound && window.__lbsSound.isReady()) {
      window.__lbsSound.hit(name, { gain: gain || 0.85, pitch: pitch || 1, pan: pan || 0 });
      return;
    }
    var c = getLoaderCtx(); if (!c || c.state !== 'running') return;
    var t = c.currentTime;
    var o1 = c.createOscillator(), g1 = c.createGain();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(name === 'tick' ? 2350 : 1180, t);
    o1.frequency.exponentialRampToValueAtTime(name === 'tick' ? 1020 : 195, t + 0.028);
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.linearRampToValueAtTime((gain || 0.5) * 0.08, t + 0.0012);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.032);
    o1.connect(g1).connect(c.destination);
    o1.start(t); o1.stop(t + 0.04);
  }

  function ecg(x) {
    var p = x - Math.floor(x);
    return 0.10 * Math.exp(-Math.pow((p - 0.18) * 16, 2)) - 0.14 * Math.exp(-Math.pow((p - 0.36) * 50, 2))
         + 1.00 * Math.exp(-Math.pow((p - 0.40) * 46, 2)) - 0.30 * Math.exp(-Math.pow((p - 0.45) * 40, 2))
         + 0.20 * Math.exp(-Math.pow((p - 0.66) * 10, 2));
  }
  function outBack(x, s) {
    x = Math.max(0, Math.min(1, x)) - 1;
    s = s || 2.1;
    return 1 + (s + 1) * x * x * x + s * x * x;
  }
  function drawSelBox(x, y, w, h, p, col) {
    if (p <= 0) return;
    var sc = Math.max(0.01, outBack(p, 2.2)), hs = 7.5 * sc, lw = 2.2;
    g.save();
    g.globalAlpha = Math.min(1, p * 3);
    g.strokeStyle = col; g.lineWidth = lw;
    g.fillStyle = 'rgba(43,92,255,0.05)';
    g.fillRect(x, y, w, h);
    g.strokeRect(x, y, w, h);
    var ky = y - hs * 3.4;
    g.beginPath(); g.moveTo(x + w / 2, y); g.lineTo(x + w / 2, ky); g.stroke();

      [x, y], [x + w / 2, y], [x + w, y],
      [x, y + h / 2], [x + w, y + h / 2],
      [x, y + h], [x + w / 2, y + h], [x + w, y + h],
      [x + w / 2, ky]
    ];
    for (var i = 0; i < pts.length; i++) {
      g.fillStyle = col;
      g.beginPath(); g.arc(pts[i][0], pts[i][1], hs, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(pts[i][0], pts[i][1], Math.max(1, hs - lw * 1.15), 0, Math.PI * 2); g.fill();

    g.restore();
  }
  function size() { var d = Math.min(window.devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; }
  size(); addEventListener('resize', size);
  function mono(px, w) { g.font = (w || 600) + ' ' + px + 'px "JetBrains Mono", ui-monospace, monospace'; }

  function draw() {
    // Time-slice bake the LBS DSP bank right inside the loader frame budget!
    if (window.__lbsBank && window.__lbsBank.step) {
      window.__lbsBank.step(8);
    }
    var now = (performance.now() - t0) / 1000;
    shown += (Math.min(prog, now / MIN) - shown) * 0.1;
    var W = cv.width, H = cv.height, s = Math.min(W / 1920, H / 1080);
    g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#050814'; g.fillRect(0, 0, W, H);
    var grd = g.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.46, Math.max(W, H) * 0.65);

    grd.addColorStop(0.5, 'rgba(10,18,42,0.96)');
    grd.addColorStop(1, 'rgba(5,8,20,1)');

    g.setTransform(s, 0, 0, s, (W - 1920 * s) / 2, (H - 1080 * s) / 2);

    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    var beat = 72 / 60, ph = now * beat, pulse = Math.exp(-Math.pow(((ph % 1) - 0.40) * 9, 2));

    mono(15); g.letterSpacing = '6px'; g.fillStyle = TEAL;
    g.fillText('TRANSMISSION 001 // NURSING CITIZEN DEVELOPMENT', 960, 164);

    // Fob watch
    var cx = 960, cy = 426, R = 148;
    g.save(); g.translate(cx, cy);
    g.strokeStyle = 'rgba(61,232,212,0.14)'; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, R + 28, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = GOLD; g.lineWidth = 3; g.shadowColor = GOLD; g.shadowBlur = 16;
    g.beginPath(); g.arc(0, 0, R + 28, -Math.PI / 2, -Math.PI / 2 + shown * Math.PI * 2); g.stroke();
    g.shadowBlur = 0;
    g.strokeStyle = MUTE; g.lineWidth = 3;
    g.beginPath(); g.arc(0, -R - 46, 16, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#22305E'; g.fillRect(-14, -R - 30, 28, 26); g.strokeRect(-14, -R - 30, 28, 26);
    g.shadowColor = TEAL; g.shadowBlur = 30 + 38 * pulse;
    g.strokeStyle = TEAL; g.lineWidth = 6.5; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.stroke();
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(10,18,44,0.94)'; g.beginPath(); g.arc(0, 0, R - 6, 0, Math.PI * 2); g.fill();
    for (var i = 0; i < 60; i++) {

      g.strokeStyle = i % 15 === 0 ? GOLD : (i % 5 ? 'rgba(169,184,214,0.42)' : INK);
      g.lineWidth = i % 15 === 0 ? 3.2 : (i % 5 ? 1.4 : 2.6);
      g.beginPath(); g.moveTo(Math.sin(a) * (R - 18), -Math.cos(a) * (R - 18)); g.lineTo(Math.sin(a) * (R - 18 - L), -Math.cos(a) * (R - 18 - L)); g.stroke();

    mono(12, 600); g.fillStyle = GOLD; g.fillText('NCD', 0, -52);
    var sec = Math.floor(now), f = now - sec, kick = f < 0.12 ? Math.sin(f / 0.12 * Math.PI) * 0.12 : 0;
    if (sec !== lastSec && !outAt) { lastSec = sec; playLbsLoaderHit('tick', 0.85, sec % 2 ? 0.92 : 1.04, sec % 2 ? 0.12 : -0.12); }

    g.strokeStyle = TEAL; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-Math.sin(ang) * 26, Math.cos(ang) * 26); g.lineTo(Math.sin(ang) * (R - 30), -Math.cos(ang) * (R - 30)); g.stroke();

    g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.sin(ma) * (R - 60), -Math.cos(ma) * (R - 60)); g.stroke();
    g.fillStyle = GOLD; g.beginPath(); g.arc(0, 0, 7, 0, Math.PI * 2); g.fill();
    g.restore();

    // ECG
    var x0 = 560, x1 = 1360, yb = 730, amp = 68, beats = 5.2;
    var head = (now * beat / beats) % 1;

    function obs(x, label, val, unit, col) {

      g.font = '700 44px "JetBrains Mono", monospace'; g.letterSpacing = '0px'; g.fillStyle = col; g.fillText(val, x, 890);

    obs(1060, 'RR', '16', '/MIN', VIO); obs(1240, 'NEWS2', '0', 'LOW', GOLD);

    var pi = Math.min(phases.length - 1, Math.floor(shown * phases.length));
    if (pi !== lastPhase) { lastPhase = pi; phaseStart = now; lastTyped = 0; }
    var fullStr = phases[pi].toUpperCase();
    var typedLen = Math.min(fullStr.length, Math.floor((now - phaseStart) * 28) + 1);
    if (typedLen > lastTyped && !outAt) {
      var ch = fullStr.charAt(typedLen - 1);
      if (ch && ch !== ' ') playLbsLoaderHit('type', 0.72, 0.96 + Math.random() * 0.08, (typedLen / fullStr.length - 0.5) * 0.4);

    g.shadowColor = TEAL; g.shadowBlur = 14; g.fillStyle = pGrad; g.fillRect(660, 1008, 600 * shown, 3); g.shadowBlur = 0;

    var sndRunning = window.__ncdAudioCtx && window.__ncdAudioCtx.state === 'running' && !window.__ncdMuted;
    mono(12, 500); g.letterSpacing = '3px'; g.fillStyle = sndRunning ? TEAL : MUTE;
    g.fillText(window.__ncdMuted ? 'SOUNDTRACK MUTED  ·  PRESS M' : (sndRunning ? 'GENERATIVE SOUNDTRACK READY' : 'CLICK OR PRESS ANY KEY TO UNLOCK SOUND'), 960, 1046);
    g.letterSpacing = '0px';

    if (isReady && now > MIN && shown > 0.985 && !outAt) {

      document.getElementById('loader').classList.add('out');
      window.removeEventListener('pageshow', tryAutoLoaderAudio);
      window.removeEventListener('focus', tryAutoLoaderAudio);
      ['pointerdown', 'mousedown', 'mouseup', 'keydown', 'keyup', 'touchstart', 'touchend', 'wheel', 'click'].forEach(function (evName) {
